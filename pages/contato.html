<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>It Girls - Contato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/contato.css">
    
</head>
<body>
    <nav>
        <div class="imagem-nome">
            <div>
                <img class="img-logo" src="../assets/logo.png" alt="logo">
            </div>
            <div>
                <h1 class="ItGirls">It Girls</h1>
                
            </div>
        </div>

        <ul>
            <li><a class="links" href="../index.html">Home</a></li>
            <li><a class="links" href="../pages/catalogo.html">Catálogo</a></li>
            <li><a class="links" href="../pages/JogoDestaque.html">Destaque</a></li>
            <li><a class="links" href="../pages/sobre.html">Sobre</a></li>
            <li><a class="links" href="../pages/contato.html">Contato</a></li>
        </ul>
    </nav>

    <main>
        <section class="formulario">
            <h2>Entre em Contato</h2>
            
            
            <form id="formContato">
                <div class="grupo-campo">
                    <label for="nome" class="campoTXT">Nome</label>
                    <input type="text" id="nome" required>
                </div>
                <div class="grupo-campo">
                    <label for="email" class="campoTXT" >E-mail</label>
                    <input type="email" id="email" required>
                </div>
                <div class="grupo-campo">
                    <label for="mensagem" class="campoTXT" >Mensagem</label>
                    <textarea id="mensagem" rows="4" required></textarea>
                </div>

                <button type="submit" class="btn w-100 botao-rosa">Enviar Mensagem</button>
            </form>
            
            <div id="feedback"></div>
        </section>
    </main>

    <footer id="main-footer">
    <ul class="footer-links">
        <li><a class="links" href="../pages/termos.html">Termos e condições</a></li>
        <li><a class="links" href="#">Acessibilidade</a></li>
        <li><a class="links" href="../pages/privacidade.html">Aviso de privacidade</a></li>
        <li><a class="links" href="../pages/termos.html">Termos de uso</a></li>
        <li><a class="links" href="#">Preferências de cookies</a></li>
    </ul>
</footer>

</body>
</html>
